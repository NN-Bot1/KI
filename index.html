<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NN's KI</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#27334d;--accent:#8b7cff;--text:#edf1ff;--muted:#9ca9c7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#192449,var(--bg) 60%);font:16px/1.5 system-ui,Segoe UI,Arial;color:var(--text);min-height:100vh;display:flex;justify-content:center}
.app{width:min(900px,100%);padding:24px 16px;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:8px 0 20px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#9c8bff,#4ddac7);display:grid;place-items:center;color:#10162a;font-weight:900;font-size:22px}
h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:13px}
#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 0 20px}
.msg{max-width:85%;padding:14px 16px;border:1px solid var(--line);border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.assistant{align-self:flex-start;background:var(--panel);border-top-left-radius:5px}.user{align-self:flex-end;background:#28264b;border-color:#494477;border-top-right-radius:5px}
.composer{position:sticky;bottom:0;background:rgba(11,16,32,.9);backdrop-filter:blur(12px);padding:12px 0 8px}
form{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px;border-radius:18px}
textarea{flex:1;resize:vertical;min-height:48px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px}
button{border:0;border-radius:13px;background:var(--accent);color:white;font-weight:700;padding:0 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
.note{color:var(--muted);font-size:12px;text-align:center;margin:9px 0 0}.status{color:#b7c3e4;font-size:13px;padding:0 4px;min-height:20px}
code{background:#222d49;padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">✦</div><div><h1>Meine KI</h1><p>Dein KI-Assistent · Antworten direkt hier im Chat</p></div></header>
<div id="chat" aria-live="polite">
<div class="msg assistant">Hallo! 👋 Ich bin deine KI. Stell mir eine Frage, bitte um Hilfe bei Code, Texten, Lernen oder Ideen.</div>
</div>
<div class="composer">
<div id="status" class="status"></div>
<form id="form"><textarea id="prompt" placeholder="Schreib deine Frage … (Enter zum Senden, Shift+Enter für neue Zeile)" required></textarea><button id="send" type="submit">Senden ↑</button></form>
<p class="note">Die Antworten werden über einen KI-Server erzeugt. Bitte keine Passwörter oder privaten Daten eingeben.</p>
</div>
</div>
<script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),promptBox=document.querySelector('#prompt'),send=document.querySelector('#send'),statusBox=document.querySelector('#status');
const history=[];
function addMessage(text,role){const div=document.createElement('div');div.className='msg '+role;div.textContent=text;chat.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'end'});return div;}
form.addEventListener('submit',async e=>{
 e.preventDefault();const text=promptBox.value.trim();if(!text||send.disabled)return;
 addMessage(text,'user');history.push({role:'user',content:text});promptBox.value='';send.disabled=true;statusBox.textContent='KI denkt nach …';
 const waiting=addMessage('Ich überlege …','assistant');
 try{
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Serverfehler');
  waiting.textContent=data.reply;history.push({role:'assistant',content:data.reply});
 }catch(err){waiting.textContent='Verbindung fehlgeschlagen: '+err.message+'\n\nFrage meinen Besitzer (Lukasweiss5b@outlook.de), ob der Server läuft und der API-Schlüssel eingerichtet ist.';}
 finally{send.disabled=false;statusBox.textContent='';promptBox.focus();}
});
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script>
</body>
</html>
